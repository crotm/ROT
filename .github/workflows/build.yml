name: GHCR Hybrid Builder Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # Use the original repo name
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Set up Environment Variables
        run: |
          # Perform lowercase conversion using standard Shell, NOT GitHub expressions
          LOWER_IMAGE=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_ID=${{ env.REGISTRY }}/${LOWER_IMAGE}" >> $GITHUB_ENV
          
          # Generate Tag based on Dockerfile hash
          DOCKER_HASH=$(sha256sum Dockerfile | cut -c1-16)
          echo "IMAGE_TAG=env-${DOCKER_HASH}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Docker Image exists
        id: check-image
        run: |
          if docker manifest inspect ${{ env.IMAGE_ID }}:${{ env.IMAGE_TAG }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push Docker Image
        if: steps.check-image.outputs.exists != 'true'
        run: |
          docker build -t ${{ env.IMAGE_ID }}:${{ env.IMAGE_TAG }} .
          docker push ${{ env.IMAGE_ID }}:${{ env.IMAGE_TAG }}

      - name: Run Build inside Container
        run: |
          chmod +x build.sh
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ${{ env.IMAGE_ID }}:${{ env.IMAGE_TAG }} ./build.sh

      - name: Archive Artifacts
        run: |
          cd output
          for dir in *; do
            if [ -d "$dir" ]; then
              tar -cJf "python-${dir}-hybrid.tar.xz" -C "$dir" .
            fi
          done

      - name: Publish "pyb" Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="pyb"
          gh release delete "$TAG_NAME" --cleanup-tag -y || true
          gh release create "$TAG_NAME" output/*.tar.xz \
            --title "Rolling Release: pyb" \
            --notes "Python FTP Source. NDK 27. API 24. Parallel Arch Build." \
            --target ${{ github.sha }}
